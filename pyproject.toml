[project]
name = "incident-pilot"
version = "3.0.0"
description = "AI-powered incident-response copilot for on-call SRE engineers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-groq",
    "langchain-core",
    "langchain-chroma",
    "langchain-text-splitters",
    "langchain-experimental",
    "langchain-huggingface",
    # Observability: Arize Phoenix -- runs in-process (no Docker), no API key.
    # arize-phoenix-evals pinned <3 -- arize-phoenix 13.x's bundled experiments
    # code imports phoenix.evals.models, which arize-phoenix-evals 3.x removed.
    "arize-phoenix",
    "arize-phoenix-evals<3",
    "openinference-instrumentation-langchain",
    "chromadb",
    "pdfplumber",
    "python-docx",
    "sentence-transformers==3.0.1",
    "transformers==4.44.0",
    "numpy<2",
    "python-dotenv",
    "requests",
    "gradio>=4.0,<5.0",
    # jinja2 3.0.x has a template-cache bug that crashes gradio 4.44's route
    # rendering (TypeError: unhashable type: 'dict'); gradio itself only needs
    # jinja2<4.0, so bump past 3.1 where that bug is fixed.
    "jinja2>=3.1,<4.0",
    # Bounds relaxed from the original <0.112/<0.38 ceilings (unused by src/
    # code -- only flask-generator's own pyproject.toml matters there) so
    # arize-phoenix's bundled server can resolve. Capped <1.0 -- Starlette's
    # 1.x line broke gradio 4.44's Jinja2Templates route rendering (TypeError:
    # unhashable type: 'dict').
    "fastapi>=0.115,<1.0",
    "starlette>=0.37.0,<1.0",
    "prometheus-client>=0.21,<1.0",
    "pydantic>=2.0,<3.0",
    "uvicorn[standard]>=0.27.0,<0.38.0",
    "mcp",
]

[dependency-groups]
test = [
    "pytest",
    "httpx",
]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
]

[tool.uv]
# Torch must be installed separately due to its platform-specific index URL:
#   uv pip install torch --index-url https://download.pytorch.org/whl/cpu
#
# On Intel macOS, `uv lock`/`uv add` can fail to resolve because chromadb's
# onnxruntime pin has no macosx_x86_64 wheel for some versions. If that
# happens, install new deps (like `mcp` above) directly instead:
#   uv pip install mcp
# then reconcile uv.lock on a platform where the full resolve succeeds
# (Apple Silicon or Linux CI).
